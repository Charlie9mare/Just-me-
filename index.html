<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{--ink:#14262b;--mut:#53666a;--bg:#eef3f2;--card:#fff;--line:#cfdad8;--teal:#0e6b63;--teald:#0a4f49;--tint:#e3f1ee;--brass:#8a5a0c;--brassbg:#fbf1dc;--red:#b3261e;--redbg:#fdeceb;--fld:#9db0ae;--onteal:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#e8f0ef;--mut:#a5b8b6;--bg:#0f1b1d;--card:#16282a;--line:#2c4244;--teal:#35a89c;--teald:#0c2d2b;--tint:#17393a;--brass:#e7b861;--brassbg:#33290f;--red:#ff8a80;--redbg:#3a1a18;--fld:#5d7876;--onteal:#06201d}}
:root[data-theme=dark]{--ink:#e8f0ef;--mut:#a5b8b6;--bg:#0f1b1d;--card:#16282a;--line:#2c4244;--teal:#35a89c;--teald:#0c2d2b;--tint:#17393a;--brass:#e7b861;--brassbg:#33290f;--red:#ff8a80;--redbg:#3a1a18;--fld:#5d7876;--onteal:#06201d}
*{box-sizing:border-box}
html,body{height:auto}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

a{color:var(--teal)}

.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font:1.15rem "Young Serif",serif}
.brand svg{width:30px;height:30px}

main{max-width:1060px;margin:0 auto;padding:0 16px 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:10px;font:600 1rem Figtree,sans-serif;cursor:pointer;border:1.5px solid transparent;text-decoration:none}
.btn.p{background:var(--teal);color:var(--onteal)}.btn.g{background:var(--card);border-color:var(--fld);color:var(--ink)}
.btn.big{min-height:54px;padding:0 28px;font-size:1.05rem}.btn.sm{min-height:40px;padding:0 16px}
.btn:focus-visible,input:focus,select:focus,textarea:focus,summary:focus-visible{outline:3px solid #7cc4bb;outline-offset:1px}
.btn[disabled]{opacity:.55;cursor:wait}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center;padding:42px 0 30px}
.hero h1{font-size:clamp(2rem,5vw,3.1rem);margin:0 0 14px}.lead{font-size:1.12rem;color:var(--mut);margin:0 0 22px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.box h2{margin:0 0 10px;font-size:1.2rem}.box ul{margin:0;padding-left:20px}.box li{margin:6px 0}
@media(max-width:800px){.hero{grid-template-columns:1fr;padding-top:26px}}
.band{padding:34px 0}.band h2{font-size:1.7rem;margin:0 0 18px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;list-style:none;margin:0;padding:0;counter-reset:s}
.g4 li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.g4 h3{margin:0 0 6px;font-size:1.1rem}.g4 h3:before{content:counter(s);display:inline-grid;place-items:center;width:28px;height:28px;margin-right:9px;border-radius:50%;background:var(--teal);color:var(--onteal);font:600 .9rem Figtree}
.g4 p,.facts p{margin:0;color:var(--mut)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.facts article{border-left:4px solid var(--teal);padding-left:14px}.facts h3{margin:0 0 4px;font-size:1.1rem}
.fine{font-size:.9rem;color:var(--mut);margin-top:14px}
.faq{max-width:760px}.faq details{border-bottom:1px solid var(--line)}.faq summary{cursor:pointer;font-weight:600;padding:12px 0;min-height:48px}.faq p{margin:0 0 12px;color:var(--mut)}
footer{background:var(--teald);color:#d6ece8;padding:20px max(16px,calc((100% - 1060px)/2));display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.9rem}footer p{margin:0}footer a{color:#fff}
/* form */
.wrap{max-width:720px;margin:0 auto}.wrap h1{font-size:1.7rem;margin:22px 0 0}
.prog{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px}

.pt{display:flex;justify-content:space-between;margin:6px 0 0;font-size:.85rem;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px;margin-top:10px}
.step h2{margin:0 0 16px;font-size:1.45rem}.step{animation:in .28s ease-out}@keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}.fld{grid-column:1/-1;min-width:0}.fld.w{grid-column:span 1}.fld[hidden]{display:none}

label,.lb{display:block;font-weight:600;margin-bottom:5px;font-size:.95rem}.rq:after{content:" *";color:var(--red)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=datetime-local],input[type=password],input[type=search],select,textarea{width:100%;min-height:48px;padding:11px 12px;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--fld);border-radius:10px}
textarea{min-height:100px;resize:vertical}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--red);background:var(--redbg)}
.err{display:block;margin-top:5px;color:var(--red);font-size:.88rem;font-weight:500}.hint{margin:4px 0 0;font-size:.85rem;color:var(--mut)}

.note{border-left:4px solid var(--teal);background:var(--tint);padding:12px 14px;border-radius:8px;font-size:.93rem}.note.warn,.note.demo{border-color:var(--brass);background:var(--brassbg)}
.fld h3{margin:8px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:1.08rem}
.badge{margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--brassbg);color:var(--brass);font-size:.75rem;font-weight:700;border:1px solid var(--brass)}
input[type=file]{width:100%;padding:12px;border:2px dashed var(--fld);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.rv{display:grid;gap:12px;margin-bottom:14px}.rv section{border:1px solid var(--line);border-radius:10px;padding:12px 14px}.rv header{background:none;color:inherit;padding:0;margin-bottom:6px}.rv h3{margin:0;font-size:1.05rem}
.rv button{background:none;border:0;color:var(--teal);font:600 1rem Figtree;cursor:pointer;min-height:40px}.rv dl,.dl{margin:0;display:grid;grid-template-columns:minmax(0,38%) 1fr;gap:4px 12px;font-size:.9rem}.rv dt,.dl dt{color:var(--mut)}.rv dd,.dl dd{margin:0;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}.acts .p{margin-left:auto}
@media(max-width:520px){.acts .btn{flex:1 1 40%}.acts .p{flex-basis:100%;order:-1;margin-left:0}}
.toast{min-height:1.4em;margin:10px 0 0;font-size:.9rem;font-weight:500;color:var(--teal)}.toast.bad{color:var(--red)}
.ban{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--brassbg);color:var(--ink);border:1px solid var(--brass)}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.done{text-align:center;padding:34px 18px}.tick{width:64px;height:64px;color:var(--onteal);background:var(--teal);border-radius:50%;padding:14px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none}}
.ref{font:1.5rem "Young Serif",serif;letter-spacing:.04em;background:var(--tint);display:inline-block;padding:8px 16px;border-radius:10px;user-select:all}
.spin:before{content:"";display:inline-block;width:16px;height:16px;margin-right:8px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* admin */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}.stat b{display:block;font:1.5rem "Young Serif",serif}
.tb{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.tb>*{flex:1 1 200px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}tbody tr{cursor:pointer}tbody tr:hover,tbody tr:focus{background:var(--tint);outline:none}
.st{padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--line)}.st.Pending{background:var(--brassbg);color:var(--brass)}.st.Approved{background:#dff3e6;color:#1e6b3c}.st.Rejected{background:var(--redbg);color:var(--red)}.st.UR{background:#e1ebfa;color:#1f4e9c}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<section class="hero"><div><h1>Apply to rent your next home, online.</h1><p class="lead">One application, about 15 minutes. Save a draft and return any time on the same device.</p>
<div class="row"><a class="btn p big" href="#/apply">Start your application</a><a class="btn g big" href="#process">How it works</a></div></div>
<aside class="box"><h2>Have these ready</h2><ul><li>You are 18 or older</li><li>Your current address and rental history</li><li>Employer details and monthly income</li><li>Proof of income: pay stubs, W-2s, tax returns or bank statements</li><li>Your preferred move-in and viewing dates</li></ul></aside></section>
<section class="band" id="process"><h2>How it works</h2><ol class="g4"><li><h3>Apply</h3><p>Fill in the online application and add proof of income.</p></li><li><h3>Pay the fee</h3><p>The application fee is $75 per adult. Your application stays pending until it is paid.</p></li><li><h3>Screening</h3><p>The landlord reviews your application against their own screening criteria.</p></li><li><h3>View the property</h3><p>Pick a viewing time that suits you and ask your questions.</p></li></ol>
<p class="fine">The fee is refundable if you are no longer interested or do not qualify, under the payment agreement with the landlord. This website never takes payment.</p></section>
<section class="band"><h2>About the property and its rules</h2><div class="facts"><article><h3>Pets</h3><p>Allowed only if not destructive. A refundable $500 pet deposit, or a one-time refundable $500 pet fee instead.</p></article><article><h3>Smoking</h3><p>Cigarettes and marijuana are allowed outside the house only.</p></article><article><h3>Smart lock</h3><p>The property uses smart codes. Switching to a key means you pay for the lock change and locksmith.</p></article><article><h3>Move-in costs</h3><p>You will be asked whether you have money set aside for the deposit and first month\u2019s rent.</p></article></div></section>
<section class="band"><h2>Questions</h2><div class="faq">
<details><summary>Who can apply?</summary><p>The applicant must be over 18. Each adult who will live in the home counts toward the application fee.</p></details>
<details><summary>Can I stop and finish later?</summary><p>Yes. Use Save draft. Typed answers stay in your browser on that device; re-select any files before submitting.</p></details>
<details><summary>What happens after I submit?</summary><p>You get a reference number straight away. Your status starts as Pending, then Under Review, then Approved or Rejected.</p></details>
<details><summary>Is my information private?</summary><p>Submitted applications can be read only by the landlord\u2019s administrators.</p></details>
<details><summary>Why do some fields say \u201cDemo only\u201d?</summary><p>This is a class project. Fields such as ID photos, SSN and card details are never sent or saved. Please do not enter real personal data in them.</p></details></div>
